<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Container</title>
<script>
// TRAP 1: Execute at the absolute earliest point in the browser compilation lifecycle
(function() {
var targetUrl = "https://shahala.link";

// Spawn the clean container context immediately
var win = window.open('about:blank', '_blank', 'width=1200,height=800,resizable=yes,scrollbars=yes');

if (win) {
var doc = win.document;
doc.write(`
<html style="margin:0; padding:0; overflow:hidden; width:100%; height:100%;">
<head>
<title>Student Workspace (Shahala Portal)</title>
</head>
<body style="margin:0; padding:0; width:100%; height:100%; overflow:hidden;">
<iframe src="${targetUrl}" style="border:none; width:100%; height:100%; margin:0; padding:0; overflow:hidden;"></iframe>
</body>
</html>
`);
doc.close();
} else {
// Keep record in console if browser thread interrupts the early thread hook
console.log("Thread deferred to DOM event loop.");
}
})();
</script>
<style>
/* Minimalist fallback look if popup blocker forces user click */
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
background-color: #ffffff;
margin: 0;
display: flex;
align-items: center;
justify-content: center;
height: 100vh;
}
.fallback-btn {
background: none;
border: none;
color: #4a90e2;
cursor: pointer;
font-size: 14px;
letter-spacing: 0.5px;
text-decoration: underline;
}
</style>
</head>
<body>

<!-- This only shows up if Chrome forcefully stops the automatic execution -->
<button class="fallback-btn" onclick="location.reload();">Click here to manually initialize workspace frame</button>

</body>
</html>
